version: negative-taxonomy/2
license_id: Apache-2.0
evidence_label: proxy
citations:
  WP3: Acoustic-family choices are engineering inference; no measured household levels or prevalence estimates are distributed.
  S02: Commercially clean household confuser audio (S02, 2026-10-08); metadata shortlist,
    no audio audition or prevalence/level measurements.
  S05: Source models for knock, doorbell and kettle (S05, 2026-10-08); no transferable
    numerical population ranges established.
  S06: Simulator fingerprints and label shortcuts (S06, 2026-10-08); shared source/room/device
    path and captured-audio separation.
  Q19:
    source: Neitzel et al., Applied Acoustics 102 (2015), Table 4; 9 homes, 7 days;
      bibliographic reference only; no measurements from it are distributed.
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4820284/
  Q22:
    source: TDK INMP441 datasheet DS-INMP441-00 r1.1;
      A-weighted totals do not specify unweighted noise PSD.
    url: https://microcontroller-course.web.cern.ch/Project_Material/resources/INMP441.pdf
  Q13:
    source: Arik et al., Interspeech 2017; hard-negative mining motivation, not a
      household prevalence source.
    url: https://www.isca-archive.org/interspeech_2017/ark17_interspeech.pdf
parameter_bounds_basis: All numerical regions are explicit unsourced proxy assumptions;
  fit authorized takes before claiming population realism.
